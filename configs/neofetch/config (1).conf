# neofetch config — AR theme with separated boxes

print_info() {
    info title
    info underline

    prin "┌─ system ───────────────────────────────────┐"
    info "│OS     " distro         
    info "│Host   " model          
    info "│Uptime " uptime         
    info "│Packages" packages       
    prin "└────────────────────────────────────────────┘"
    prin "┌─ display ──────────────────────────────────┐"
    info "│WM     " wm             
    info "│Terminal" term           
    info "│Resolution" resolution      
    info "│Theme  " theme          
    prin "└────────────────────────────────────────────┘"
    prin "┌─ hardware ─────────────────────────────────┐"
    info "│CPU " cpu            
    info "│Memory " memory         
    info "│Swap   " swap           
    info "│Disk   " disk           
    prin "└────────────────────────────────────────────┘"
    prin " "
    info cols
}

# ── ASCII logo ──────────────────────────────────────────
image_backend="ascii"
image_source="${HOME}/.config/neofetch/AR.txt"
ascii_colors=(4 4 4 4 4 4)
ascii_bold="on"

# ── title ───────────────────────────────────────────────
title_fqdn="off"

# ── kernel ──────────────────────────────────────────────
kernel_shorthand="on"

# ── distro ──────────────────────────────────────────────
distro_shorthand="off"
os_arch="on"

# ── uptime ──────────────────────────────────────────────
uptime_shorthand="on"

# ── packages ────────────────────────────────────────────
package_managers="on"

# ── shell ───────────────────────────────────────────────
shell_path="off"
shell_version="on"

# ── resolution ──────────────────────────────────────────
refresh_rate="on"

# ── GTK ─────────────────────────────────────────────────
gtk_shorthand="on"
gtk2="off"
gtk3="on"

# ── CPU ─────────────────────────────────────────────────
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
speed_shorthand="on"
cpu_temp="C"

# ── GPU ─────────────────────────────────────────────────
gpu_brand="on"
gpu_type="integrated"

# ── memory ──────────────────────────────────────────────
memory_percent="on"
memory_unit="gib"

# ── disk ────────────────────────────────────────────────
disk_show=('/')
disk_subtitle="none"
disk_percent="on"

# ── colors & style ──────────────────────────────────────
colors=(4 7 4 4 4 7)
bold="on"
underline_enabled="on"
underline_char="─"
separator=" "

# ── color blocks ────────────────────────────────────────
color_blocks="on"
block_range=(0 7)
block_width=3
block_height=1
col_offset="auto"

# ── misc ────────────────────────────────────────────────
stdout="off"
